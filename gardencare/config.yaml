# GardenCare as a Home Assistant App (N49) -- experimental beta.
#
# This is the only Home Assistant configuration in the repository. There is
# deliberately no second copy: two config.yaml files that must agree are two
# files that will eventually disagree, and the symptom is an App that installs
# with the wrong image or the wrong version.
#
# `version` must equal the tag the workflow publishes. CI checks that before it
# pushes anything (`.github/workflows/docker-publish.yml`), because an App whose
# version says one thing while its image says another is an App the Supervisor
# will never update correctly.
name: GardenCare
version: "0.1.0-beta.17"
slug: gardencare
description: >-
  Gartenpflege-Assistent: Pflanzen, Pflegeplan, Aufgaben, Fotos und Kalender --
  lokal auf dem eigenen Gerät. Experimenteller Beta-Test.
url: https://github.com/TFeLABoraNET/plantcalendar

# Experimental, and it says so where Home Assistant shows it. This build exists
# for HG-01 -- a person installing GardenCare and using it -- not for release.
stage: experimental

# One multi-arch image rather than the `{arch}` placeholder. The placeholder is a
# compatibility fallback for repositories publishing per-architecture images;
# GardenCare publishes a manifest, and naming it directly means the Supervisor
# pulls the right layer without the name having to encode the answer.
image: ghcr.io/tfelaboranet/gardencare
arch:
  - aarch64
  - amd64

# Ingress: reached through Home Assistant's own authentication, at a path the
# Supervisor assigns and strips. The application already handles that -- N36
# injects a per-request <base href> so a deep link survives a reload -- so
# nothing here needs to configure a base path.
ingress: true
ingress_port: 8000
panel_icon: mdi:sprout
panel_title: Garten

# Visible to everyone in the household, not only administrators. An add-on's
# ingress panel defaults to admin-only (`panel_admin: true`), which is why a
# non-admin member of the household saw no "Garten" entry in the Home Assistant
# sidebar at all. GardenCare is a shared household tool -- the person who waters
# the plants is often not the person who administers Home Assistant -- so the
# panel is opened to all users. Every request still passes through Home
# Assistant's own authentication first; this widens who sees the entry, not
# whether the door is locked.
panel_admin: false

# Read the Core API through the Supervisor proxy, using the SUPERVISOR_TOKEN the
# Supervisor injects at runtime. That is how GardenCare reads sensors and the
# weather entity, and how it sends notifications through a Home Assistant service.
#
# No token is configured here and none can be: it does not exist until the App
# runs. Nothing below asks the user for a credential either -- Mistral, Pl@ntNet
# and Telegram are configured in GardenCare's own Settings screen, which stores
# them in the database. A second secret store in App options would be a second
# place to leak them from.
homeassistant_api: true

# The Supervisor restarts the App when this stops answering (N51). It points at
# the liveness endpoint, not at diagnostics: `docs/API.md` § 4 keeps `/health`
# free of any state, and `docs/SECURITY.md` § 3 requires that healthcheck output
# never become an information leak. A watchdog aimed at a richer endpoint would
# be both -- it would publish the garden's state to anything that can reach the
# port, and it would restart GardenCare because a *sensor* was unavailable.
watchdog: http://[HOST]:[PORT:8000]/api/v1/health

# Stop the App before a Home Assistant backup, and start it again after.
#
# The database is SQLite in WAL mode. A hot copy taken while the scheduler is
# mid-transaction can capture a database file and a write-ahead log that do not
# agree, and the household discovers it at the only moment it matters -- while
# restoring. A few seconds offline during a nightly backup is the cheaper half
# of that trade. This is the Supervisor's backup of the whole App; GardenCare's
# own export and restore is N52 and does not exist yet.
backup: cold

# AppArmor is on, and `apparmor.txt` beside this file is the profile the
# Supervisor loads. Written and reviewed, never yet loaded on Home Assistant OS
# from this repository -- see the header of that file, and HG-03.
apparmor: true

# Explicitly *not* requested, and each absence is a decision:
#   hassio_api / hassio_role  -- GardenCare never talks to the Supervisor itself
#   host_network              -- Ingress needs no host networking
#   privileged / full_access  -- nothing here touches hardware
#   map: [config, ssl, share] -- the App's data belongs in /data, nowhere else
#   devices                   -- no camera or serial device is used
#
# `/data` is provided by the Supervisor and persists across restarts and updates.
# It holds the SQLite database and the photo files, and it is the only thing a
# tester needs to keep.

init: false

options: {}
schema: {}
